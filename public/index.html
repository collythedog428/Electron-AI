<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-token" content="__APP_TOKEN__">
<title>Electron</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1><span class="logo">⚡</span> Electron</h1>

    <section>
      <label for="model">Model</label>
      <select id="model"></select>
      <button id="refresh-models" class="ghost" type="button">Refresh model list</button>
      <p id="model-info" class="muted small"></p>
    </section>

    <section>
      <label class="check"><input type="checkbox" id="thinking"> Adaptive thinking</label>
      <label for="effort">Effort</label>
      <select id="effort">
        <option value="">Model default</option>
        <option value="low">low</option>
        <option value="medium">medium</option>
        <option value="high">high</option>
        <option value="xhigh">xhigh</option>
        <option value="max">max</option>
      </select>
    </section>

    <section>
      <label for="system">System prompt</label>
      <textarea id="system" rows="4" placeholder="Optional"></textarea>
    </section>

    <section class="key-section">
      <h2>API key</h2>
      <p id="key-status" class="muted small">Checking…</p>
      <form id="key-form">
        <input id="key-input" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" required>
        <button type="submit">Verify &amp; save</button>
      </form>
      <button id="key-delete" class="danger ghost" type="button" hidden>Remove stored key</button>
      <p class="muted small">Encrypted with the Windows keychain (DPAPI) for your user account. It is never shown again or sent to the page.</p>
    </section>

    <section>
      <p id="local-access" class="muted small"></p>
    </section>

    <button id="clear" class="ghost" type="button">Clear conversation</button>
  </aside>

  <main>
    <div id="log" class="log" aria-live="polite"></div>
    <form id="composer">
      <textarea id="input" rows="3" placeholder="Message Claude… (Enter to send, Shift+Enter for a new line)"></textarea>
      <div class="actions">
        <span id="status" class="muted small"></span>
        <button type="button" id="stop" class="ghost" hidden>Stop</button>
        <button type="submit" id="send">Send</button>
      </div>
    </form>
  </main>
</div>
<script src="app.js" defer></script>
</body>
</html>
