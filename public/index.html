<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-token" content="__APP_TOKEN__">
<title>Electron</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Main">
    <div class="brand" aria-hidden="true">⚡</div>
    <button class="nav-item active" type="button" data-view="chat" aria-current="page">
      <span class="icon" aria-hidden="true">💬</span>Chat
    </button>
    <button class="nav-item" type="button" data-view="settings">
      <span class="icon" aria-hidden="true">⚙️</span>Settings
    </button>
  </nav>

  <div class="views">
    <!-- Chat view -->
    <section id="view-chat" class="view active">
      <header class="chat-head">
        <div>
          <h2>Chat</h2>
          <span id="model-badge" class="badge">No model</span>
        </div>
        <button id="clear" class="ghost" type="button">Clear conversation</button>
      </header>
      <div class="chat-body">
        <div id="log" class="log" aria-live="polite"></div>
        <form id="composer">
          <textarea id="input" rows="3" placeholder="Message Claude… (Enter to send, Shift+Enter for a new line)"></textarea>
          <div class="actions">
            <span id="status" class="muted small"></span>
            <button type="button" id="stop" class="ghost" hidden>Stop</button>
            <button type="submit" id="send">Send</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Settings view -->
    <section id="view-settings" class="view">
      <div class="settings-body">
        <h2 class="page-title">Settings</h2>
        <p class="lead">Choose how Claude replies and manage your API key.</p>

        <div class="cards">
          <article class="card">
            <h3><span class="icon" aria-hidden="true">🧠</span>Model</h3>
            <div class="field">
              <label for="model">Model</label>
              <select id="model"></select>
            </div>
            <div class="row">
              <button id="refresh-models" class="ghost" type="button">Refresh model list</button>
            </div>
            <p id="model-info" class="hint"></p>
          </article>

          <article class="card">
            <h3><span class="icon" aria-hidden="true">🎛️</span>Reply options</h3>
            <label class="check"><input type="checkbox" id="thinking"> Adaptive thinking</label>
            <div class="field">
              <label for="effort">Effort</label>
              <select id="effort">
                <option value="">Model default</option>
                <option value="low">low</option>
                <option value="medium">medium</option>
                <option value="high">high</option>
                <option value="xhigh">xhigh</option>
                <option value="max">max</option>
              </select>
            </div>
            <div class="field">
              <label for="system">System prompt</label>
              <textarea id="system" rows="4" placeholder="Optional instructions for every reply"></textarea>
            </div>
          </article>

          <article class="card key-section">
            <h3><span class="icon" aria-hidden="true">🔑</span>API key</h3>
            <p id="key-status" class="hint">Checking…</p>
            <form id="key-form" class="field">
              <label for="key-input">Paste a new key</label>
              <input id="key-input" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" required>
              <div class="row">
                <button type="submit">Verify &amp; save</button>
                <button id="key-delete" class="danger" type="button" hidden>Remove stored key</button>
              </div>
            </form>
            <p class="hint">Encrypted with the Windows keychain (DPAPI) for your user account. It is never shown again or sent to the page.</p>
          </article>

          <article class="card">
            <h3><span class="icon" aria-hidden="true">🌐</span>Browser access</h3>
            <p id="local-access" class="hint"></p>
          </article>
        </div>
      </div>
    </section>
  </div>
</div>
<script src="app.js" defer></script>
</body>
</html>
